<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Aditi S. Phadke</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .not-found-inner { max-width: 680px; }
    .not-found h1 { margin-inline: auto; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <p class="eyebrow">404</p>
      <h1>This page wandered off.</h1>
      <p class="lead">The address may have changed, or the page may no longer exist.</p>
      <a class="button-link" style="background:#174355" href="/">Return home</a>
    </div>
  </main>
</body>
</html>
